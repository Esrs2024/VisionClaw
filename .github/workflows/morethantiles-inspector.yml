name: MoreThanTiles Inspector Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'morethantiles-inspector/**'
      - '.github/workflows/morethantiles-inspector.yml'
  pull_request:
    branches: [main]
    paths:
      - 'morethantiles-inspector/**'
      - '.github/workflows/morethantiles-inspector.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: morethantiles-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Inspector with official Meta DAT SDK from Maven Central
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Verify launchable activity in manifest
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "launchable-activity: name='com.morethantiles.inspector.MainActivity'"
      - name: Stage installer
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MORETHANTILES_INSPECTOR_DAT_V3.apk
          cd dist
          sha256sum MORETHANTILES_INSPECTOR_DAT_V3.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MORETHANTILES_INSPECTOR_DAT_V3
          path: morethantiles-inspector/dist/
          retention-days: 14
