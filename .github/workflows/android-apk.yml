name: Compilar VisionClaw para gafas reales

on:
  workflow_dispatch:
  push:
    branches: [main, gemini-direct]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'samples/CameraAccessAndroid/**'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: samples/CameraAccessAndroid
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Comprobar que existe el secreto de paquetes
        env:
          META_PACKAGES_TOKEN: ${{ secrets.META_PACKAGES_TOKEN }}
        run: |
          if [ -z "$META_PACKAGES_TOKEN" ]; then
            echo "::error::Guarda META_PACKAGES_TOKEN en Settings > Secrets and variables > Actions. Debe ser un token classic con read:packages."
            exit 1
          fi

      - name: Preparar configuracion sin claves incrustadas
        run: |
          cp app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess/Secrets.kt.example app/src/main/java/com/meta/wearable/dat/externalsampleapps/cameraaccess/Secrets.kt

      - name: Verificar que no hay simulador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main")
          forbidden = ("MockDeviceKit", "mwdat.mockdevice", "hasMockDevices")
          for path in root.rglob("*"):
              if path.suffix in (".kt", ".kts"):
                  content = path.read_text()
                  assert not any(word in content for word in forbidden), str(path)
          assert "mwdat.mockdevice" not in Path("app/build.gradle.kts").read_text()
          assert 'mwdat = "1.0.1"' in Path("gradle/libs.versions.toml").read_text()
          print("SDK actual y sin código ni dependencia de simulación.")
          PY

      - name: Compilar APK ARM64 para Xiaomi 14
        env:
          GITHUB_TOKEN: ${{ secrets.META_PACKAGES_TOKEN }}
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Preparar descarga y suma de comprobacion
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VisionClaw-Gafas-Reales-Xiaomi14-arm64.apk
          cd dist
          sha256sum VisionClaw-Gafas-Reales-Xiaomi14-arm64.apk > SHA256SUMS.txt

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-Gafas-Reales-Xiaomi14-arm64
          path: samples/CameraAccessAndroid/dist/
          if-no-files-found: error
          retention-days: 14
